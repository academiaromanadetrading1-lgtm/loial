<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alătură-te - Loial</title>
<style>
body { font-family: system-ui; background: #0a0a0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.box { background: #111; padding: 32px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; }
.card-preview { padding: 20px; border-radius: 12px; margin: 16px 0; }
input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #1a1a1f; color: #fff; margin-top: 8px; box-sizing: border-box; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: linear-gradient(135deg, #a855f7, #06b6d4); color: #fff; cursor: pointer; margin-top: 16px; }
.qr { margin-top: 20px; }
</style>
</head>
<body>
<div class="box">
  <h2 id="bizName">Se încarcă...</h2>
  <div class="card-preview" id="cardPreview"><p id="reward"></p></div>
  <form id="enrollForm">
    <input type="text" id="name" placeholder="Numele tău" required>
    <input type="tel" id="phone" placeholder="Telefon (opțional)">
    <button type="submit" class="btn">Descarcă cardul în Wallet →</button>
  </form>
  <div id="result" class="qr" style="display:none">
    <p>Cardul tău e gata!</p>
    <div id="qrcode"></div>
    <p style="font-size:12px;color:#888">Arată acest QR la casă</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const bizId = location.pathname.split('/').pop();
const storageKey = 'loial_card_' + bizId;
const savedUuid = localStorage.getItem(storageKey);

fetch('/api/business-public/' + bizId).then(r => r.json()).then(d => {
  document.getElementById('bizName').textContent = d.name;
  document.getElementById('reward').textContent = d.reward_text || 'Recompensă';
  document.getElementById('cardPreview').style.background = d.card_color || '#1e293b';
});

if (savedUuid) {
  document.getElementById('enrollForm').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  new QRCode(document.getElementById('qrcode'), savedUuid);
  document.querySelector('#result p').textContent = 'Cardul tău:';
}

document.getElementById('enrollForm').onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch('/api/enroll', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ business_id: parseInt(bizId), name: document.getElementById('name').value, phone: document.getElementById('phone').value })
  });
  if (res.status === 403) { alert('Limita de clienți atinsă'); return; }
  const data = await res.json();
  localStorage.setItem(storageKey, data.uuid);
  document.getElementById('enrollForm').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  new QRCode(document.getElementById('qrcode'), data.uuid);
};
</script>
</body>
</html>
