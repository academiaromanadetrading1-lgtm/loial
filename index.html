<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loial - Carduri digitale de loialitate fără aplicații</title>
<meta name="description" content="Creează carduri digitale de loialitate fără aplicații în 3 minute. Gratuit până la 50 de clienți.">
<link href="https://googleapis.com" rel="stylesheet">
<style>
  :root {
    --bg: #f6f9f7;
    --surface: #ffffff;
    --text-main: #111f18;
    --text-muted: #475d52;
    --border: #dce6e0;
    --primary: #2d6a4f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text-main); line-height: 1.6; }
  .gradient-text { background: linear-gradient(135deg, #2d6a4f 0%, #52b788 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav-container { display: flex; justify-content: space-between; align-items: center; padding: 14px 32px; max-width: 1240px; margin: 0 auto; }
  @media (max-width: 768px) { .nav-container { padding: 12px 16px; } }
  
  .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: var(--text-main); text-decoration: none; }
  .logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, #2d6a4f, #52b788); color: #fff; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 800; }

  nav { display: flex; gap: 14px; align-items: center; }
  .nav-link { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; transition: color 0.2s; }
  .nav-link:hover { color: var(--primary); }
  @media (max-width: 900px) { .hide-mobile { display: none; } }

  .dropdown { position: relative; display: inline-block; }
  .dropdown-btn { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; background: #edf3ef; border: 1px solid var(--border); color: var(--text-main); font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .dropdown-menu { display: none; position: absolute; top: 115%; left: 0; background: #ffffff; min-width: 250px; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(17, 31, 24, 0.12); padding: 8px; z-index: 200; }
  .dropdown-menu.show { display: grid; grid-template-columns: 1fr; gap: 2px; }
  .dropdown-menu a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; text-decoration: none; color: var(--text-main); font-size: 13.5px; font-weight: 500; border-radius: 8px; }
  .dropdown-menu a:hover { background: #edf3ef; color: var(--primary); }

  .lang-select { background: #ffffff; border: 1px solid var(--border); color: var(--text-main); padding: 7px 8px; border-radius: 8px; font-size: 12px; font-weight: 600; }
  .btn-outline { padding: 8px 16px; border: 1px solid var(--border); border-radius: 10px; background: #ffffff; color: var(--text-main); cursor: pointer; font-weight: 600; font-size: 13.5px; font-family: inherit; transition: 0.2s; }
  .btn-outline:hover { background: #edf3ef; border-color: var(--primary); }
  .btn-primary { padding: 9px 18px; border: none; border-radius: 10px; background: linear-gradient(135deg, #2d6a4f, #40916c); color: #fff; cursor: pointer; font-weight: 600; font-size: 13.5px; font-family: inherit; box-shadow: 0 4px 12px rgba(45, 106, 79, 0.25); transition: 0.2s; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(45, 106, 79, 0.32); }

  .hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 50px; padding: 60px 32px; align-items: center; max-width: 1240px; margin: 0 auto; }
  @media (max-width: 960px) { .hero { grid-template-columns: 1fr; padding: 36px 20px; gap: 36px; } }
  
  .badge { display: inline-block; padding: 6px 14px; background: #e8f3ed; border: 1px solid #b7d7c5; color: #2d6a4f; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 18px; }
  .hero h1 { font-size: 48px; line-height: 1.12; margin-bottom: 18px; font-weight: 800; letter-spacing: -0.02em; }
  @media (max-width: 600px) { .hero h1 { font-size: 34px; } }
  .hero p.subtitle { color: var(--text-muted); font-size: 16.5px; margin-bottom: 26px; max-width: 540px; }
  .cta-big { padding: 15px 30px; font-size: 16px; border-radius: 12px; }
  .micro { font-size: 13px; color: #64748b; margin-top: 12px; font-weight: 500; }
  
  .stats { display: flex; gap: 36px; margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--border); }
  .stat-value { font-size: 22px; font-weight: 800; color: var(--text-main); }
  .stat-label { font-size: 12.5px; color: var(--text-muted); }

  /* Simulator Premium */
  .simulator { background: #ffffff; border: 1px solid var(--border); border-radius: 26px; padding: 26px; box-shadow: 0 24px 50px -12px rgba(17, 31, 24, 0.1); }
  .sim-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; text-align: center; }
  .sim-controls label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; margin-top: 10px; font-weight: 600; }
  .sim-controls input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #f8fafc; color: #0f172a; font-size: 14px; font-family: inherit; }
  .colors { display: flex; gap: 10px; margin-top: 8px; }
  .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 0 1px #cbd5e1; cursor: pointer; transition: 0.2s; }
  .color-btn.active { box-shadow: 0 0 0 2.5px var(--primary); transform: scale(1.12); }

  .wallet-card {
    position: relative;
    width: 100%;
    max-width: 320px;
    margin: 22px auto;
    border-radius: 22px;
    padding: 20px;
    color: #ffffff;
    background: linear-gradient(135deg, #2d6a4f 0%, #111f18 100%);
    transition: all 0.35s ease;
    box-shadow: 0 20px 35px -10px rgba(17, 31, 24, 0.35), inset 0 1px 1px rgba(255,255,255,0.25);
    overflow: hidden;
  }
  .wallet-card::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.16) 0%, transparent 50%);
    pointer-events: none;
  }
  .wallet-card.unlocked {
    box-shadow: 0 22px 40px -10px rgba(245, 158, 11, 0.45), 0 0 0 2.5px #f59e0b;
  }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-weight: 700; font-size: 15px; position: relative; z-index: 1; }
  .card-brand-left { display: flex; align-items: center; gap: 9px; }
  .card-avatar { width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .stamp-pill { background: rgba(255,255,255,0.18); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .wallet-card.unlocked .stamp-pill { background: #f59e0b; color: #111f18; }

  .stamps-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin-bottom: 14px; background: rgba(0, 0, 0, 0.18); padding: 10px; border-radius: 14px; position: relative; z-index: 1; }
  .stamp { aspect-ratio: 1; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; transition: all 0.3s ease; }
  .stamp.filled { background: #ffffff; color: #111f18; border: none; font-weight: 800; transform: scale(1.05); }
  .stamp.reward-slot { border-color: #fbbf24; }
  .stamp.reward-slot.filled { background: #fbbf24; color: #111f18; }

  .card-qr { background: #ffffff; border-radius: 14px; padding: 10px; margin-top: 14px; text-align: center; position: relative; z-index: 1; }
  .card-qr span { display: block; color: #475569; font-size: 10.5px; font-weight: 600; margin-top: 4px; }

  /* Secțiuni Generale */
  .section-wrap { max-width: 1240px; margin: 0 auto 80px auto; padding: 0 32px; }
  @media (max-width: 768px) { .section-wrap { padding: 0 20px; margin-bottom: 60px; } }
  .section-header { text-align: center; max-width: 680px; margin: 0 auto 38px auto; }
  .section-header h2 { font-size: 32px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.02em; }
  .section-header p { color: var(--text-muted); font-size: 16px; }

  /* Cum funcționează */
  .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  @media (max-width: 820px) { .steps-grid { grid-template-columns: 1fr; } }
  .step-card { background: #ffffff; border: 1px solid var(--border); border-radius: 20px; padding: 26px; }
  .step-num { width: 36px; height: 36px; border-radius: 10px; background: #e8f3ed; color: #2d6a4f; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; font-size: 15px; }
  .step-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .step-card p { font-size: 14px; color: var(--text-muted); }

  /* Industrii */
  .bento-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  @media (max-width: 960px) { .bento-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .bento-grid { grid-template-columns: 1fr; } }
  .bento-card { background: #ffffff; border: 1px solid var(--border); border-radius: 18px; padding: 22px; text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
  .bento-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(15, 23, 42, 0.06); }
