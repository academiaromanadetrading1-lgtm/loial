<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creează cont - Loial</title>
<style>
body { font-family: system-ui; background: #0a0a0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.form-box { background: #111; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; }
h1 { font-size: 24px; margin-bottom: 24px; }
label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; margin-top: 16px; }
input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #1a1a1f; color: #fff; box-sizing: border-box; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: linear-gradient(135deg, #a855f7, #06b6d4); color: #fff; font-size: 16px; cursor: pointer; margin-top: 24px; }
.color-preview { width: 40px; height: 40px; border-radius: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div class="form-box">
  <h1>Creează-ți contul</h1>
  <form id="regForm">
    <label>Email</label>
    <input type="email" id="email" required>
    <label>Parolă</label>
    <input type="password" id="password" required minlength="6">
    <label>Numele afacerii</label>
    <input type="text" id="bizName" required>
    <label>Recompensa</label>
    <input type="text" id="reward">
    <label>Culoare card</label>
    <input type="text" id="color" readonly>
    <div class="color-preview" id="colorPreview"></div>
    <button type="submit" class="btn">Creează cont și card →</button>
  </form>
</div>
<script>
document.getElementById('bizName').value = localStorage.getItem('draft_biz') || '';
document.getElementById('reward').value = localStorage.getItem('draft_reward') || 'A 6-a e din partea casei!';
const color = localStorage.getItem('draft_color') || '#1e293b';
document.getElementById('color').value = color;
document.getElementById('colorPreview').style.background = color;

document.getElementById('regForm').onsubmit = async (e) => {
  e.preventDefault();
  const data = {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    business_name: document.getElementById('bizName').value,
    reward: document.getElementById('reward').value,
    color: document.getElementById('color').value
  };
  const res = await fetch('/api/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });
  if (res.ok) {
    const result = await res.json();
    localStorage.setItem('token', result.token);
    localStorage.removeItem('draft_biz');
    localStorage.removeItem('draft_reward');
    localStorage.removeItem('draft_color');
    location.href = '/platform.html';
  } else {
    alert('Eroare la înregistrare');
  }
};
</script>
</body>
</html>
