<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creează cont gratuit - Loial</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; background: #f6f9f7; color: #111f18; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
  .form-box { background: #ffffff; padding: 36px; border-radius: 24px; width: 100%; max-width: 420px; border: 1px solid #dce6e0; box-shadow: 0 20px 40px rgba(17, 31, 24, 0.06); }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; color: #2d6a4f; margin-bottom: 16px; text-decoration: none; }
  h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  p.sub { font-size: 14px; color: #475d52; margin-bottom: 20px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: #475d52; margin-bottom: 5px; margin-top: 14px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid #dce6e0; border-radius: 10px; background: #f6f9f7; color: #111f18; font-size: 14px; box-sizing: border-box; font-family: inherit; }
  input:focus { outline: none; border-color: #2d6a4f; background: #ffffff; }
  .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(135deg, #2d6a4f, #40916c); color: #ffffff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 22px; box-shadow: 0 6px 18px rgba(45, 106, 79, 0.25); font-family: inherit; }
  .color-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .color-preview { width: 42px; height: 42px; border-radius: 10px; border: 1px solid #dce6e0; flex-shrink: 0; }
  .ref-pill { background: #e8f3ed; border: 1px solid #b7d7c5; color: #2d6a4f; font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 10px; margin-bottom: 14px; display: none; }
  .err-box { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-top: 14px; display: none; }
</style>
</head>
<body>
<div class="form-box">
  <a href="/" class="logo">● LOIAL.SPACE</a>
  <h1>Creează-ți contul gratuit</h1>
  <p class="sub">Cardul tău digital este pregătit. Completează datele pentru activare:</p>
  <div class="ref-pill" id="refBadge">🤝 Recomandat prin cod partener: <span id="refCodeLabel"></span></div>
  <form id="regForm">
    <label>Email afacere</label>
    <input type="email" id="email" placeholder="contact@afacereata.ro" required>
    <label>Parolă</label>
    <input type="password" id="password" placeholder="Minim 6 caractere" required minlength="6">
    <label>Numele afacerii</label>
    <input type="text" id="bizName" placeholder="Ex: Cafeneaua Centrală" required>
    <label>Recompensa oferită clienților</label>
    <input type="text" id="reward">
    <label>Culoarea cardului</label>
    <div class="color-row">
      <div class="color-preview" id="colorPreview"></div>
      <input type="text" id="color" readonly>
    </div>
    <div class="err-box" id="errBox"></div>
    <button type="submit" class="btn" id="submitBtn">Activează contul și cardul →</button>
  </form>
</div>
<script>
const urlRef = new URLSearchParams(location.search).get('ref');
if (urlRef) localStorage.setItem('loial_ref_code', urlRef.trim());
const savedRef = localStorage.getItem('loial_ref_code') || '';
if (savedRef) {
  document.getElementById('refBadge').style.display = 'block';
  document.getElementById('refCodeLabel').textContent = savedRef;
}

document.getElementById('bizName').value = localStorage.getItem('draft_biz') || '';
document.getElementById('reward').value = localStorage.getItem('draft_reward') || 'La 6 vizite primești un premiu din partea noastră!';
const color = localStorage.getItem('draft_color') || '#2d6a4f';
document.getElementById('color').value = color;
document.getElementById('colorPreview').style.background = color;

document.getElementById('regForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errBox = document.getElementById('errBox');
  errBox.style.display = 'none';
  btn.textContent = 'Se activează cardul...';
  btn.disabled = true;

  const data = {
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
    business_name: document.getElementById('bizName').value.trim(),
    reward: document.getElementById('reward').value.trim(),
    color: document.getElementById('color').value,
    ref_code: savedRef
  };
  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.detail || 'Acest email este deja înregistrat.');

    localStorage.setItem('token', result.token);
    localStorage.setItem('biz_id', result.business_id);
    localStorage.setItem('biz_name', data.business_name);
    localStorage.setItem('biz_reward', data.reward);
    localStorage.removeItem('draft_biz');
    localStorage.removeItem('draft_reward');
    localStorage.removeItem('draft_color');
    location.href = '/platform.html';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
    btn.textContent = 'Activează contul și cardul →';
    btn.disabled = false;
  }
};
</script>
</body>
</html>
