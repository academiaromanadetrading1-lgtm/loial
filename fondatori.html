<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parteneri Fondatori LOIAL</title><style>body{margin:0;background:#f4f8f5;font:16px system-ui;color:#183328}header{padding:20px 5%;background:white}header a{color:#246343;text-decoration:none;font-weight:800}.founder-section{max-width:1320px;margin:24px auto;padding:32px;border-radius:28px;background:#152e25;color:#f6fcf8;overflow:hidden}.founder-section h2{font-size:clamp(26px,4vw,42px);letter-spacing:-.03em;line-height:1.15;margin:12px 0}.founder-section p{color:#d1e6d9;max-width:750px}.founder-section a{color:#d6fbe1}.founder-count{font-weight:800;margin:16px 0;color:#b6f0c7}.founder-label{font-size:12px;font-weight:700;letter-spacing:.04em;margin:12px 0;color:#c6dfcf}.founder-band{overflow:hidden;margin:10px 0}.founder-track,.founder-group{display:flex;width:max-content;gap:12px}.founder-group{padding-right:12px}.founder-track{gap:0;animation:founder-scroll 48s linear infinite}.founder-band:nth-child(2) .founder-track{animation-direction:reverse;animation-duration:56s}.founder-band:nth-child(3) .founder-track{animation-duration:64s}.founder-tile{width:218px;min-height:70px;border:1px solid #456657;border-radius:14px;background:#244538;display:flex;align-items:center;gap:10px;padding:12px;color:#fff;flex-shrink:0}.founder-logo{position:relative;display:grid;place-items:center;width:42px;height:42px;background:#dce9df;color:#24523c;border-radius:10px;font-weight:800;flex-shrink:0;overflow:hidden}.founder-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:white}.founder-name{font-weight:650;font-size:13px;overflow-wrap:anywhere}.founder-tile small{font-size:11px;color:#d7ebe0}.founder-paused .founder-track,.founder-band:hover .founder-track{animation-play-state:paused}.founder-controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:16px}.founder-controls button{background:transparent;color:#fff;border:1px solid #8ba99b;padding:9px 12px;border-radius:10px;cursor:pointer}.founder-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:20px 0}.founder-gallery .founder-tile{width:auto}@keyframes founder-scroll{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.founder-track{animation:none}.founder-band{overflow-x:auto}}@media(max-width:600px){.founder-section{margin:16px;padding:22px}}</style></head><body><header><a href="/">LOIAL · Acasă</a></header><main class="founder-section" data-founders="gallery"><h1>Partenerii fondatori LOIAL</h1><p>Primele 500 de firme validate și înscrise cu acordul lor primesc un loc permanent în galeria fondatorilor, cât timp programul și platforma funcționează. Afișarea poate fi retrasă la cerere.</p><div class="founder-count" data-founder-count>Se încarcă locurile disponibile…</div><div class="founder-gallery" data-founder-list></div><p><a href="/register.html">Înscrie-ți firma gratuit →</a></p></main><script>(()=>{const root=document.querySelector('[data-founders]');if(!root)return;
const demo=['Exemplu · Cafenea 01','Exemplu · Bistro 02','Exemplu · Florărie 03','Exemplu · Studio 04','Exemplu · Atelier 05','Exemplu · Brutărie 06','Exemplu · Retail 07','Exemplu · Frizerie 08','Exemplu · Restaurant 09','Exemplu · Service auto 10','Exemplu · Pizzerie 11','Exemplu · Patiserie 12','Exemplu · Ceainărie 13','Exemplu · Pet shop 14','Exemplu · Salon 15','Exemplu · Spălătorie 16','Exemplu · Cofetărie 17','Exemplu · Magazin 18','Exemplu · Optică 19','Exemplu · Fitness 20','Exemplu · Studio foto 21','Exemplu · Băcănie 22','Exemplu · Gelaterie 23','Exemplu · Librărie 24','Exemplu · Cadouri 25','Exemplu · Boutique 26','Exemplu · Barber 27','Exemplu · Fast food 28','Exemplu · Catering 29','Exemplu · Design 30'];
const node=(tag,cls,txt)=>{const e=document.createElement(tag);e.className=cls;if(txt)e.textContent=txt;return e};
function tile(m,decorative=false){const el=node('div','founder-tile');if(decorative)el.setAttribute('aria-hidden','true');const logo=node('span','founder-logo',m.name.replace(/^Exemplu · /,'').split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase());if(m.has_logo&&Number.isInteger(m.slot)){const img=node('img','');img.src='/api/loial-founders/logo/'+m.slot;img.alt='';img.loading='lazy';img.onerror=()=>img.remove();logo.append(img)}el.append(logo,node('span','founder-name',m.name));if(m.city)el.append(node('small','',m.city));return el}
function draw(data){const members=Array.isArray(data?.members)?data.members:[];const status=root.querySelector('[data-founder-count]');status.textContent=data?data.reserved+' / 500 locuri rezervate · '+data.remaining+' disponibile':'Numărul locurilor nu este disponibil momentan.';const list=root.querySelector('[data-founder-list]');list.replaceChildren();if(root.dataset.founders==='gallery'){for(const m of members)list.append(tile(m));if(!members.length)list.append(node('p','','Încă nu sunt afișați parteneri validați.'));return}
const actual=members.length>0;const examples=root.querySelector('[data-founder-demo]');examples.textContent=actual?'Parteneri fondatori validați':'DEMONSTRAȚIE GRAFICĂ · 30 exemple fictive, nu parteneri înscriși';
const items=actual?members:demo.map(name=>({name}));for(let row=0;row<3;row++){const subset=items.filter((_,i)=>i%3===row);if(!subset.length)continue;const band=node('div','founder-band');const track=node('div','founder-track');for(let copy=0;copy<2;copy++){const group=node('div','founder-group');if(copy)group.setAttribute('aria-hidden','true');for(const m of subset)group.append(tile(m,!!copy));track.append(group)}band.append(track);list.append(band)}}
root.querySelector('[data-founder-pause]')?.addEventListener('click',e=>{const paused=root.classList.toggle('founder-paused');e.currentTarget.textContent=paused?'Repornește animația':'Oprește animația';e.currentTarget.setAttribute('aria-pressed',String(paused))});
fetch('/api/loial-founders',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(draw).catch(()=>draw(null));})();</script></body></html>
