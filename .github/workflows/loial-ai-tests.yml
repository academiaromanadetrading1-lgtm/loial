name: Loial AI / Native Messaging Tests

on:
  push:
    branches:
      - chatgpt/loial-ai-business-foundation-20261116
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      JWT_SECRET_KEY: "CI-only-testing-signing-secret-not-for-prod-2026"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Loial modules
        run: python -m py_compile loial_inbox.py loial_business_ai.py loial_analytics.py loial_industries.py loial_marketing.py loial_knowledge.py loial_identity.py loial_premium_wallet.py loial_weekly_jobs.py loial_receipts.py loial_wallet_sync.py loial_google_issuer.py loial_google_pilot.py loial_preflight.py loial_expenses.py loial_wallet_recovery.py loial_apple_updates.py loial_pwa.py loial_friend_referrals.py loial_revenue_commissions.py loial_stripe_billing.py loial_backup.py main.py
      - name: Verify inline JavaScript syntax without browser or external calls
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for(const file of ['join.html','loial-ai.html','loial-receipt.html','wallet-recovery.html','platform.html','scan.html','loial-wallet.html','ambasador.html']){
            const html=fs.readFileSync(file,'utf8');
            let n=0;
            for(const match of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){
              new Function(match[1]);n++;
            }
            if(!n)throw Error('Script absent: '+file);
            console.log(file+': '+n+' script valid');
          }
          NODE
      - name: Validate PWA helper, service worker and manifest
        run: |
          node --check loial-i18n.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const code=fs.readFileSync('loial-i18n.js','utf8');
          const prefs=new Map();
          const node={children:[],textContent:'Salvează profilul',closest:()=>null};
          const document={readyState:'loading',documentElement:{},addEventListener(){},dispatchEvent(){},
            querySelectorAll(q){return q.startsWith('h1')?[node]:[];},getElementById(){return null;}};
          const context={document,localStorage:{getItem:k=>prefs.get(k),setItem:(k,v)=>prefs.set(k,v)},
            window:{addEventListener(){}},CustomEvent:function(){}};
          vm.runInNewContext(code,context);
          const l=context.window.LoialLang;
          for(const lang of ['en','de','fr','it','es','nl','pl','hu']){
            l.set(lang);
            assert.equal(document.documentElement.lang,lang);
            assert.notEqual(node.textContent,'Salvează profilul');
            assert.equal(node.textContent,l.t('Salvează profilul'));
            assert.equal(l.t('customer-private text'),'customer-private text');
            assert.equal(prefs.get('loial_language'),lang);
          }
          l.set('ro');assert.equal(node.textContent,'Salvează profilul');
          NODE
          node --check loial-pwa-install.js
          node --check sw.js
          node -e "const x=require('./manifest.json');if(x.start_url.slice(0,7)!='/wallet'||x.display!=='standalone'||x.icons.length<2)process.exit(1);"
      - name: Isolated tests without external APIs
        run: python -m pytest -q tests/test_loial_ai_core.py tests/test_loial_inbox.py tests/test_loial_premium_wallet.py tests/test_loial_weekly_jobs.py tests/test_loial_receipts.py tests/test_loial_wallet_sync.py tests/test_loial_google_issuer.py tests/test_loial_wallet_recovery.py tests/test_loial_apple_updates.py tests/test_loial_managerial_decisions.py tests/test_loial_preflight.py tests/test_loial_expenses.py tests/test_loial_friend_referrals.py tests/test_loial_wise_pilot.py test_loial_two_level_commissions.py tests/test_loial_stripe_billing.py tests/test_loial_backup.py tests/test_loial_release_ui.py
      - name: Full FastAPI startup and enrollment on isolated SQLite
        run: python -m pytest -q tests/test_loial_app_integration.py
