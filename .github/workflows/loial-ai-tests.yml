name: Loial AI / Native Messaging Tests

on:
  push:
    branches:
      - chatgpt/loial-ai-business-foundation-20261116
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      JWT_SECRET_KEY: "CI-only-testing-signing-secret-not-for-prod-2026"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Loial modules
        run: python -m py_compile loial_inbox.py loial_business_ai.py loial_analytics.py loial_industries.py loial_marketing.py loial_knowledge.py main.py
      - name: Isolated tests without external APIs
        run: python -m pytest -q tests/test_loial_ai_core.py tests/test_loial_inbox.py
