name: Loial AI / Native Messaging Tests

on:
  push:
    branches:
      - chatgpt/loial-ai-business-foundation-20261116

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      JWT_SECRET_KEY: "CI-only-testing-signing-secret-not-for-prod-2026"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Loial modules
        run: python -m py_compile loial_inbox.py loial_business_ai.py loial_analytics.py loial_industries.py loial_marketing.py loial_knowledge.py loial_identity.py loial_premium_wallet.py loial_weekly_jobs.py loial_receipts.py loial_wallet_sync.py loial_google_issuer.py loial_apple_updates.py main.py
      - name: Verify inline JavaScript syntax without browser or external calls
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for(const file of ['join.html','loial-ai.html','loial-receipt.html','platform.html','scan.html']){
            const html=fs.readFileSync(file,'utf8');
            let n=0;
            for(const match of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){
              new Function(match[1]);n++;
            }
            if(!n)throw Error('Script absent: '+file);
            console.log(file+': '+n+' script valid');
          }
          NODE
      - name: Isolated tests without external APIs
        run: python -m pytest -q tests/test_loial_ai_core.py tests/test_loial_inbox.py tests/test_loial_premium_wallet.py tests/test_loial_weekly_jobs.py tests/test_loial_receipts.py tests/test_loial_wallet_sync.py tests/test_loial_google_issuer.py tests/test_loial_apple_updates.py tests/test_loial_managerial_decisions.py
      - name: Full FastAPI startup and enrollment on isolated SQLite
        run: python -m pytest -q tests/test_loial_app_integration.py
