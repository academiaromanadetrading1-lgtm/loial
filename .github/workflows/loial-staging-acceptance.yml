name: LOIAL staging acceptance
on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/loial-staging-acceptance-20261118
    paths:
      - 'scripts/staging-acceptance.approved'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QR decoder
        run: python -m pip install opencv-python-headless
      - name: Compile acceptance runner
        run: python -m py_compile scripts/staging_acceptance.py scripts/staging_growth_acceptance.py scripts/staging_founders_acceptance.py
      - name: Run isolated synthetic acceptance
        env:
          LOIAL_QA_ADMIN_PASSWORD: ${{ secrets.LOIAL_QA_ADMIN_PASSWORD }}
        run: python scripts/staging_discovery_acceptance.py
