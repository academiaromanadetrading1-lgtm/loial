name: LOIAL security regressions

on:
  pull_request:
    paths:
      - 'main.py'
      - 'loial_stripe_billing.py'
      - 'loial_preflight.py'
      - 'test_launch_preflight.py'
      - 'index.html'
      - 'login.html'
      - 'register.html'
      - 'join.html'
      - 'scan.html'
      - 'test_scan_idempotency.cjs'
      - 'test_wallet_storage_recovery.cjs'
      - 'test_i18n_dictionary.cjs'
      - 'test_language_switching.cjs'
      - 'test_pwa_install_contract.cjs'
      - 'loial-pwa-install.js'
      - 'sw.js'
      - 'manifest.json'
      - 'loial-i18n.js'
      - 'platform.html'
      - 'ci_check_inline_js.py'
      - 'test_join_route_isolation.py'
      - 'test_legacy_campaign_disabled.py'
      - 'test_legacy_agent_signup_security.py'
      - 'test_legacy_enrollment_disabled.py'
      - 'test_merchant_token_isolation.py'
      - 'test_platform_admin_isolation.py'
      - 'test_principal_type_separation.py'
      - 'test_public_feedback_throttle.py'
      - 'test_stripe_business_token_isolation.py'
      - 'test_stamp_ledger_sqlite.py'
      - 'test_stripe_billing_rules.py'
      - 'loial_scans.py'
      - 'test_scan_cooldown.py'
      - 'test_wallet_private_access.py'
      - 'loial_inbox.py'
      - 'loial_winback.py'
      - 'loial_winback_campaigns.py'
      - 'loial_receipts.py'
      - 'test_winback_campaign_attribution.py'
      - 'test_winback_campaign_api.py'
      - 'test_app_boot_smoke.py'
      - 'requirements.txt'
      - 'test_winback_core.py'
      - '.github/workflows/loial-security-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated database test dependency
        run: python -m pip install 'sqlalchemy>=2,<3' 'fastapi>=0.100' 'pydantic>=2,<3' 'httpx>=0.25' 'python-jose[cryptography]>=3.3'
      - name: Install app dependencies for real boot test
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m py_compile main.py loial_stripe_billing.py loial_preflight.py loial_winback.py loial_winback_campaigns.py loial_receipts.py
      - name: Check inline JavaScript syntax
        run: python ci_check_inline_js.py join.html scan.html platform.html
      - name: Test scan idempotency in Node
        run: node test_scan_idempotency.cjs
      - name: Test wallet storage recovery in Node
        run: node test_wallet_storage_recovery.cjs
      - name: Validate translation dictionary
        run: node test_i18n_dictionary.cjs
      - name: Test language preferences and switching
        run: node test_language_switching.cjs
      - name: Validate PWA installation contract and privacy
        run: node test_pwa_install_contract.cjs
      - name: Run isolated security regression tests
        run: |
          python -m unittest -v \
            test_legacy_campaign_disabled \
            test_launch_preflight \
            test_join_route_isolation \
            test_legacy_agent_signup_security \
            test_legacy_enrollment_disabled \
            test_merchant_token_isolation \
            test_platform_admin_isolation \
            test_principal_type_separation \
            test_public_feedback_throttle \
            test_stripe_business_token_isolation \
            test_stamp_ledger_sqlite \
            test_scan_cooldown \
            test_wallet_private_access \
            test_stripe_billing_rules \
            test_winback_core \
            test_winback_campaign_attribution \
            test_winback_campaign_api \
            test_app_boot_smoke
