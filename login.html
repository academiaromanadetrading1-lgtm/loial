<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loial – Autentificare</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f9f7; --surface:#ffffff; --primary:#2d6a4f; --text:#111f18; --dim:#475d52; --border:#dce6e0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .container { width:100%; max-width:420px; }
  .logo { text-align:center; margin-bottom:24px; }
  .logo a { text-decoration:none; color:var(--primary); font-size:1.75rem; font-weight:800; display:inline-flex; align-items:center; gap:8px; }
  .logo p { color:var(--dim); margin-top:4px; font-size:0.9rem; }
  .card { background:var(--surface); border-radius:24px; padding:32px; border:1px solid var(--border); box-shadow:0 20px 40px rgba(17,31,24,0.06); }
  .tabs { display:flex; gap:6px; margin-bottom:22px; background:#edf3ef; padding:5px; border-radius:12px; }
  .tab { flex:1; padding:10px; border:none; border-radius:9px; background:transparent; color:var(--dim); cursor:pointer; font-size:0.88rem; font-weight:700; font-family:inherit; }
  .tab.active { background:#ffffff; color:var(--primary); box-shadow:0 2px 8px rgba(17,31,24,0.08); }
  .form-group { margin-bottom:14px; }
  label { display:block; margin-bottom:5px; font-size:0.82rem; font-weight:600; color:var(--dim); }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:#f6f9f7; color:var(--text); font-size:0.95rem; font-family:inherit; }
  input:focus { outline:none; border-color:var(--primary); background:#ffffff; }
  .btn { width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,#2d6a4f,#40916c); color:#fff; font-size:0.95rem; font-weight:700; cursor:pointer; margin-top:8px; font-family:inherit; box-shadow:0 6px 16px rgba(45,106,79,0.22); }
  .error { background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:11px; border-radius:10px; margin-bottom:14px; font-size:0.88rem; font-weight:600; display:none; }
  .success { background:#dcfce7; border:1px solid #86efac; color:#166534; padding:11px; border-radius:10px; margin-bottom:14px; font-size:0.88rem; font-weight:600; display:none; }
  .hidden { display:none; }
  .footer-link { text-align:center; margin-top:18px; font-size:0.88rem; color:var(--dim); }
  .footer-link a { color:var(--primary); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <a href="/">● LOIAL.SPACE</a>
    <p>Panou de administrare și fidelizare</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button type="button" class="tab active" id="tabLogin" onclick="showTab('login')">Autentificare</button>
      <button type="button" class="tab" id="tabPwd" onclick="showTab('password')">Schimbă parola</button>
    </div>
    <div id="error" class="error"></div>
    <div id="success" class="success"></div>
    
    <form id="login-form" onsubmit="login(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" required placeholder="nume@afacere.ro">
      </div>
      <div class="form-group">
        <label>Parolă</label>
        <input type="password" id="login-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" id="loginBtn">Intră în cont →</button>
    </form>

    <form id="password-form" class="hidden" onsubmit="changePassword(event)">
      <div class="form-group">
        <label>Email cont</label>
        <input type="email" id="pwd-email" required placeholder="nume@afacere.ro">
      </div>
      <div class="form-group">
        <label>Parola actuală</label>
        <input type="password" id="pwd-old" required placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>Parola nouă (minim 10 caractere)</label>
        <input type="password" id="pwd-new" required minlength="10" maxlength="72" placeholder="••••••••">
      </div>
      <button type="submit" class="btn" id="pwdBtn">Actualizează parola →</button>
    </form>

    <div class="footer-link">Nu ai încă un cont? <a href="/register.html">Creează card gratuit →</a></div>
  </div>
</div>
<script>
function showTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabPwd').classList.toggle('active', tab === 'password');
  document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
  document.getElementById('password-form').classList.toggle('hidden', tab !== 'password');
  hideMessages();
}
function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('success').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('success');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('error').style.display = 'none';
}
function hideMessages() {
  document.getElementById('error').style.display = 'none';
  document.getElementById('success').style.display = 'none';
}
async function login(e) {
  e.preventDefault();
  hideMessages();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('loginBtn');
  btn.textContent = (window.LoialLang?.t("Se conectează...") ?? "Se conectează...");
  btn.disabled = true;

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || (window.LoialLang?.t("Email sau parolă incorectă") ?? "Email sau parolă incorectă"));

    localStorage.setItem('token', data.access_token);
    localStorage.setItem('user', JSON.stringify(data.user || {email}));
    if (data.business_id) localStorage.setItem('biz_id', data.business_id);
    window.location.href = '/platform.html';
  } catch (err) {
    showError(err.message || 'Eroare de conectare');
    btn.textContent = (window.LoialLang?.t("Intră în cont →") ?? "Intră în cont →");
    btn.disabled = false;
  }
}
async function changePassword(e) {
  e.preventDefault();
  hideMessages();
  const email = document.getElementById('pwd-email').value.trim();
  const old_password = document.getElementById('pwd-old').value;
  const new_password = document.getElementById('pwd-new').value;
  const btn = document.getElementById('pwdBtn');
  btn.textContent = (window.LoialLang?.t("Se salvează...") ?? "Se salvează...");
  btn.disabled = true;

  try {
    const res = await fetch('/api/change-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, old_password, new_password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Eroare la schimbarea parolei');
    showSuccess('Parola a fost actualizată! Te poți autentifica acum.');
    document.getElementById('login-email').value = email;
    setTimeout(() => showTab('login'), 1200);
  } catch (err) {
    showError(err.message);
  }
  btn.textContent = (window.LoialLang?.t("Actualizează parola →") ?? "Actualizează parola →");
  btn.disabled = false;
}
</script>
<script>if(new URLSearchParams(location.search).get('tab')==='password')showTab('password');</script>
<script src="/loial-i18n.js"></script>
</body>
</html>
