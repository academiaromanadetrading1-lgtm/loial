<!DOCTYPE html>
<html lang="ro">
<head>
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Casă - Loial.space</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  :root {
    --bg: #f6f9f7;
    --surface: #ffffff;
    --primary: #2d6a4f;
    --text: #111f18;
    --muted: #475d52;
    --border: #dce6e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; }

  .card { width: 100%; max-width: 430px; background: var(--surface); border: 1px solid var(--border); border-radius: 26px; padding: 30px 24px; box-shadow: 0 18px 40px rgba(17, 31, 24, 0.08); text-align: center; }
  .badge { display: inline-block; background: #e8f3ed; color: var(--primary); font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 999px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  h1 { font-size: 23px; font-weight: 800; margin-bottom: 6px; }
  p.sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }

  input {
    width: 100%; padding: 14px; border: 1.5px solid var(--border); border-radius: 14px;
    background: #f6f9f7; font-size: 22px; font-weight: 800; text-align: center; letter-spacing: 8px;
    color: var(--text); margin-bottom: 14px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--primary); background: #ffffff; }

  .btn-primary {
    width: 100%; padding: 16px 20px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #2d6a4f, #40916c); color: #ffffff;
    font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 20px rgba(45, 106, 79, 0.28);
  }
  .btn-secondary {
    width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px;
    background: #ffffff; color: var(--muted); font-size: 13px; font-weight: 700;
    cursor: pointer; margin-top: 14px; font-family: inherit;
  }
  .btn-reward {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #f59e0b, #d97706); color: #ffffff;
    font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 14px; font-family: inherit;
    box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35);
  }

  .status-box { margin-top: 16px; padding: 20px; border-radius: 18px; background: #e8f3ed; border: 1.5px solid #b7d7c5; }
  .status-box.reward { background: #fef3c7; border-color: #f59e0b; }
  .status-box.error { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <span class="badge">TERMINAL ANGAJAT</span>
  <h1 id="bizName">Conectare Casă</h1>
  <p class="sub" id="subText">Introdu PIN-ul tău de 4 cifre pentru a activa acest telefon ca terminal</p>

  <!-- ECRAN ACTIVARE TELEFON ANGAJAT -->
  <div id="pinScreen">
    <input type="password" id="pinInput" maxlength="4" inputmode="numeric" placeholder="••••">
    <button type="button" class="btn-primary" onclick="activateTerminal()">Activează telefonul pentru scanare →</button>
    <p id="pinError" style="color:#dc2626;font-size:13px;font-weight:700;margin-top:10px;"></p>
  </div>

  <!-- ECRAN ACTIV -->
  <div id="readyScreen" class="hidden">
    <div id="resultBox" class="status-box">
      <div style="font-size:32px;margin-bottom:8px;">📷</div>
      <div style="font-size:16px;font-weight:800;color:var(--primary);margin-bottom:6px;">Telefon pregătit!</div>
      <p style="font-size:13.5px;color:var(--muted);">Deschide <strong>Camera foto</strong> a telefonului (fără să faci poză), îndreaptă obiectivul spre codul QR al clientului și atinge link-ul care apare pe ecran.</p>
    </div>

    <button type="button" class="btn-secondary" onclick="resetTerminal()">Schimbă angajatul / PIN-ul</button>
  </div>
</div>

<script>
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const scannedWalletUuid = new URLSearchParams(window.location.search).get('wallet_uuid') || '';
  const approvalToken = new URLSearchParams(window.location.search).get('receipt_approval') || '';
  const isDirectScan = Boolean(scannedWalletUuid || approvalToken);

  let bizId = (!isDirectScan && pathParts[0] === 'scan' && /^\d+$/.test(pathParts[1] || ''))
    ? pathParts[1]
    : (localStorage.getItem('loial_terminal_biz_id') || '');
  let staffPin = localStorage.getItem('loial_terminal_pin') || '';
  let currentRewardText = 'Premiu de fidelitate';

  async function init() {
    if (bizId) {
      try {
        const res = await fetch(`/api/loial-public/${bizId}`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById('bizName').textContent = data.name;
          currentRewardText = data.reward_text || currentRewardText;
          if (data.card_color) document.documentElement.style.setProperty('--primary', data.card_color);
        }
      } catch (e) {}
    }

    if (bizId && staffPin.length === 4) {
      document.getElementById('pinScreen').classList.add('hidden');
      document.getElementById('readyScreen').classList.remove('hidden');
      document.getElementById('subText').textContent = (window.LoialLang?.t("Terminal activ pentru acordarea ștampilelor") ?? "Terminal activ pentru acordarea ștampilelor");

      if (approvalToken) { await confirmSmartReceipt(); }
      else if (isDirectScan && scannedWalletUuid) {
        await grantStampDirect(scannedWalletUuid);
      }
    } else if (isDirectScan) {
      document.getElementById('subText').textContent = 'Acest telefon nu este încă activat. Deschide întâi link-ul de scanare al firmei.';
    }
  }
  init();

  function activateTerminal() {
    const pin = document.getElementById('pinInput').value.trim();
    if (!/^\d{4}$/.test(pin)) {
      document.getElementById('pinError').textContent = 'Introdu un PIN valid din 4 cifre.';
      return;
    }
    localStorage.setItem('loial_terminal_biz_id', bizId);
    localStorage.setItem('loial_terminal_pin', pin);
    staffPin = pin;
    document.getElementById('pinScreen').classList.add('hidden');
    document.getElementById('readyScreen').classList.remove('hidden');
    document.getElementById('subText').textContent = (window.LoialLang?.t("Terminal activ pentru acordarea ștampilelor") ?? "Terminal activ pentru acordarea ștampilelor");
    if (approvalToken) { confirmSmartReceipt(); }
    else if (isDirectScan && scannedWalletUuid) {
      grantStampDirect(scannedWalletUuid);
    }
  }

  function resetTerminal() {
    localStorage.removeItem('loial_terminal_biz_id');
    localStorage.removeItem('loial_terminal_pin');
    staffPin = '';
    document.getElementById('pinInput').value = '';
    document.getElementById('readyScreen').classList.add('hidden');
    document.getElementById('pinScreen').classList.remove('hidden');
  }

  async function confirmSmartReceipt(){
    const box=document.getElementById('resultBox');
    box.textContent=(window.LoialLang?.t("Se confirmă încasarea...") ?? "Se confirmă încasarea...");
    try{
      const response=await fetch('/api/loial-receipts/confirm-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_id:Number(bizId),pin:staffPin,approval_token:approvalToken})});
      const x=await response.json();if(!response.ok)throw Error(x.detail||(window.LoialLang?.t("Confirmare refuzată") ?? "Confirmare refuzată"));
      playBeep();{if(window.LoialLang?.bindText){window.LoialLang.bindText(box,"✓ Plată confirmată · Ștampile: {count}/{target}",{count:x.stamps,target:x.target});}else{box.textContent=('✓ Plată confirmată · '+x.stamps+'/'+x.target+' ștampile');}}
    }catch(e){{if(window.LoialLang?.bindText){window.LoialLang.bindText(box,"Confirmare nereușită: {error}",{error:e.message});}else{box.textContent=('Confirmare nereușită: '+e.message);}}}
  }
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch (e) {}
  }

  function stableScanOperation(walletUuid) {
    const key='loial_pending_scan_'+bizId+'_'+walletUuid;
    const created=Date.now();
    try{
      const pending=JSON.parse(sessionStorage.getItem(key)||'null');
      if(pending&&pending.id&&created-pending.when<5*60*1000)return pending.id;
      const id=crypto.randomUUID();
      sessionStorage.setItem(key,JSON.stringify({id,when:created}));
      return id;
    }catch(error){return crypto.randomUUID();}
  }
  async function grantStampDirect(walletUuid) {
    const box = document.getElementById('resultBox');
    box.className = 'status-box';
    box.innerHTML = (window.LoialLang?.t("⏳ Se acordă ștampila...") ?? "⏳ Se acordă ștampila...");

    try {
      const res = await fetch('/api/scan-universal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          business_id: parseInt(bizId),
          customer_uuid: walletUuid,
          pin: staffPin,
          idempotency_key: stableScanOperation(walletUuid)
        })
      });
      const responseText = await res.text();
      let data = {};
      try { data = responseText ? JSON.parse(responseText) : {}; } catch (_) {}

      if (!res.ok) {
        const detail = typeof data.detail === 'string'
          ? data.detail
          : Array.isArray(data.detail)
            ? data.detail.map(item => item.msg || 'Date invalide').join('; ')
            : `Serverul a răspuns cu HTTP ${res.status}`;
        box.className = 'status-box error';
        box.textContent = '❌ ' + detail;
        console.error('Loial scan: HTTP', res.status, responseText.slice(0, 300));
        return;
      }

      if(data.duplicate_ignored){
        box.className='status-box';
        box.textContent=(window.LoialLang?.t("✓ Această scanare a fost deja procesată. Ștampilele nu s-au dublat.") ?? "✓ Această scanare a fost deja procesată. Ștampilele nu s-au dublat.");
        return;
      }
      playBeep();
      box.replaceChildren();
      function addLine(text, fontSize, color) {
        const element=document.createElement('div');
        element.style.fontSize=fontSize;
        if(color)element.style.color=color;
        element.textContent=text;
        box.appendChild(element);
        return element;
      }
      const count=Number(data.stamps)||0, target=Number(data.target)||6;
      if (data.reward_unlocked) {
        box.className='status-box reward';
        const title=addLine('🏆 PREMIU DEBLOCAT!', '19px');
        title.style.fontWeight='800';title.style.marginBottom='7px';
        addLine('Client: '+(data.name||'Client')+' ('+count+'/'+target+')','14px');
        const reward=addLine('🎁 '+currentRewardText,'14px','#92400e');
        reward.style.fontWeight='700';reward.style.margin='10px 0';
        const button=document.createElement('button');
        button.type='button';button.className='btn-reward';
        button.textContent=(window.LoialLang?.t("🎁 Acordă premiul și resetează cardul (0)") ?? "🎁 Acordă premiul și resetează cardul (0)");
        button.onclick=()=>redeemDirect(walletUuid);
        box.appendChild(button);
      } else {
        box.className='status-box';
        const title=addLine('✓ Ștampilă adăugată!', '18px','var(--primary)');
        title.style.fontWeight='800';title.style.marginBottom='5px';
        addLine('Client: '+(data.name||'Client'),'15px');
        const progress=addLine('Progres: '+count+' / '+target+' ★','17px');
        progress.style.fontWeight='800';progress.style.marginTop='8px';
        const note=addLine('Poți închide fereastra sau scana următorul client cu Camera telefonului.','12px','var(--muted)');
        note.style.marginTop='11px';
      }
    } catch (e) {
      box.className = 'status-box error';
      box.innerHTML = '<strong>❌ Eroare de conexiune. Încearcă din nou.</strong>';
    }
  }

  async function redeemDirect(walletUuid) {
    const box = document.getElementById('resultBox');
    try {
      const res = await fetch('/api/redeem-reward', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          business_id: parseInt(bizId),
          customer_uuid: walletUuid,
          pin: staffPin
        })
      });
      if (res.ok) {
        playBeep();
        box.className = 'status-box';
        box.innerHTML = `
          <div style="font-size:18px;font-weight:800;color:var(--primary);">✅ Premiu acordat!</div>
          <div style="font-size:14px;margin-top:4px;">Cardul clientului a fost resetat la <strong>0 ștampile</strong>.</div>
        `;
      }
    } catch (e) {}
  }
</script>
<script src="/loial-i18n.js"></script>
</body>
</html>
